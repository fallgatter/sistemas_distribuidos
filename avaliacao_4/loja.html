<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="lStyle.css">
    <title>Loja</title>
</head>
<body>
    <header>
        <h1>Área da Loja</h1>
    </header>

    <div class="loja-container">
        <h2>Cadastro de Promoção</h2>

        <form id="cadastro-promocao-form">
            <div class="form-group"> 
                <label for = "store_name">Nome da Loja:</label>
                <input type="text" id="store_name" name="store_name" required>
            </div>

            <div class="form-group">
                <label for="store_email">Email da Loja:</label>
                <input type="email" id="store_email" name="store_email" required>
            </div>

            <div class="form-group"> 
                <label for="category">Categoria do Produto:</label>
                <select id="category" name="category" required>
                    <option value="">--Selecione--</option>
                </select>
            </div>

            <div class="form-group">
                <label for="item_name">Nome do Produto:</label>
                <input type="text" id="item_name" name="item_name" required>
            </div>

            <div class="form-group">
                <label for="price">Preço:</label>
                <input type="number" id="price" name="price" required>
            </div>

            <div class="form-group">
                <label for="title">Título da Promoção:</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="form-group">
                <label for="description">Descrição Complementar:</label>
                <input type="text" id="description" name="description" required>
            </div>

            <button type="submit">Cadastrar Promoção</button>

        </form>
    
    </div>

    <script>
        const GATEWAY_URL = "http://localhost:5000";

        async function loadCategories() {
            try {
                const response = await fetch('promocao_categorias.txt');
                if (!response.ok) { throw new Error('Erro ao carregar o arquivo de categorias'); }

                const text = await response.text();
                const categories = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);

                const categorySelect = document.getElementById('category');

                categories.forEach((category, index) => {
                    const option = document.createElement('option');
                    option.value = index + 1; 
                    option.textContent = category;
                    categorySelect.appendChild(option);
                });
            } catch (error) {
                console.error("Erro ao processar as categorias da loja:", error);
            }
        }

        document.getElementById('cadastro-promocao-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            
            const dadosPromocao = {
                store_name: document.getElementById('store_name').value,
                store_email: document.getElementById('store_email').value,
                category: document.getElementById('category').value,
                item_name: document.getElementById('item_name').value,
                price: parseFloat(document.getElementById('price').value),
                title: document.getElementById('title').value,
                description: document.getElementById('description').value
            };

            try {
                const response = await fetch(`${GATEWAY_URL}/cadastrar_promocao`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(dadosPromocao)
                });

                const result = await response.text();
                alert(result);

                if(response.status === 201 || response.ok){
                    document.getElementById('cadastro-promocao-form').reset();
                }

            } catch (error) {
                console.error("Erro ao cadastrar promoção:", error);
                alert("Erro ao tentar conectar com Gateway.");
            }
        });

        window.addEventListener('load', loadCategories);
    </script>
</body>
</html>
